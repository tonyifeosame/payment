[PHP]
; L3/L6: sized for this application on a 512 MB instance. The largest upload is
; a school logo (validated at 5 MB); nothing else posts more than a form. The old
; 100 MB body limit and 2 GB memory limit let one request exhaust the container.
memory_limit = 256M
post_max_size = 8M
upload_max_filesize = 6M
max_file_uploads = 2
variables_order = EGPCS
expose_php = Off
display_errors = Off
log_errors = On
pcov.directory = .
