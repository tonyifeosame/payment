[PHP]
; L3/L6: sized for this application on a 512 MB instance. The largest upload is
; a student CSV import (validated at 10 MB by StudentImportService); a school logo
; is validated at 5 MB; nothing else posts more than a form. upload_max_filesize
; leaves 1 MB above the CSV limit so a 10 MB file reaches validation, and
; post_max_size adds room for the form fields. The old 100 MB body limit and 2 GB
; memory limit let one request exhaust the container.
memory_limit = 256M
post_max_size = 12M
upload_max_filesize = 11M
max_file_uploads = 2
variables_order = EGPCS
expose_php = Off
display_errors = Off
log_errors = On
pcov.directory = .
