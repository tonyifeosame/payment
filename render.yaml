####################################################################################
# Render Blueprint — cheapest configuration that still runs the payment pipeline
#
#   Paystack payment -> webhook -> settlement -> durable payout obligation
#     -> queued payout job -> worker -> Paystack transfer -> receipt
#
# Cost floor (Hobby workspace, $0/mo, no seat fees):
#   web    0.5c-512mb   $7.00/mo   smallest paid plan; Free is disqualified below
#   worker 0.5c-512mb   $7.00/mo   smallest plan offered — workers have no Free tier
#   cron   0.5c-512mb   $1.00/mo   metered per second of runtime; $1/mo minimum
#   pg     0.1c-256mb   $6.00/mo   smallest PAID Postgres; Free expires after 30 days
#   pg disk 1 GB        $0.30/mo   $0.30/GB/mo; can be grown online, never shrunk
#                       ---------
#                       $21.30/mo
#
# Every line below is already at the cheapest option Render sells for that role.
# See the notes on each service for why the next step down is not safe.
####################################################################################

services:
  # ---------------------------------------------------------------------------
  # Web: checkout, the Paystack webhook, and the signed receipt pages.
  #
  # runtime MUST be docker. Render's native runtimes are Node, Python, Ruby, Go,
  # Rust and Elixir only — there is no PHP runtime, and no `publicDirectory`
  # field in the Blueprint spec. This service previously declared `env: php`,
  # which Render cannot build.
  #
  # NOT plan: free, for two independent reasons:
  #   1. Free web services cannot open outbound connections on ports 25/465/587.
  #      RegistrationController and SchoolAuthController call Mail::send()
  #      synchronously from the request, so school onboarding and password reset
  #      mail would fail outright on Free.
  #   2. Free services sleep after 15 minutes of inactivity and take ~1 minute to
  #      wake. The Paystack webhook is the settlement trigger; a cold start on
  #      every low-traffic delivery risks timeouts and forces Paystack retries.
  # ---------------------------------------------------------------------------
  - type: web
    name: laravel-app
    runtime: docker
    dockerfilePath: ./docker/Dockerfile
    dockerContext: .
    plan: 0.5c-512mb
    # Overrides the image's CMD (supervisord runs octane + a queue worker + a
    # scheduler). On Render those extra processes would duplicate the dedicated
    # worker and cron below and compete for 512 MB, so the web service runs the
    # HTTP server only. --workers=1 keeps Octane inside the 512 MB plan.
    dockerCommand: php artisan octane:start --server=frankenphp --host=0.0.0.0 --port=8000 --workers=1
    healthCheckPath: /up
    envVars:
      # Pins the port Render probes to the one Octane binds. Render's default is
      # 10000, and its auto-detection could otherwise latch onto FrankenPHP's
      # Caddy admin port instead of the HTTP port.
      - key: PORT
        value: 8000
      - key: APP_ENV
        value: production
      - key: APP_NAME
        sync: false
      - key: APP_DEBUG
        value: false
      # Set ONCE in the Render dashboard and never rotated: APP_KEY signs the
      # receipt URLs we email out and encrypts session data. generateValue would
      # mint a new key if the service were ever recreated, silently invalidating
      # every previously issued receipt link. sync:false keeps it out of the repo.
      - key: APP_KEY
        sync: false
      # sync:false, NOT ${RENDER_EXTERNAL_URL}: Render does not interpolate
      # variables inside Blueprint values, so that expression is stored as the
      # literal string "${RENDER_EXTERNAL_URL}" — the same bug that already bit
      # SESSION_DOMAIN. Paste the real https URL into all three services'
      # dashboards; they must match, because the worker signs the receipt links
      # this service has to validate.
      - key: APP_URL
        sync: false
      # Required: DATABASE_URL only populates the pgsql connection, so without an
      # explicit DB_CONNECTION Laravel would default to sqlite and ignore it.
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: database
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      # SESSION_DOMAIN is deliberately absent. The previous value used
      # ${RENDER_EXTERNAL_URL_WITHOUT_SCHEME}, which Render does not define, so the
      # literal string became the cookie domain and browsers rejected it. Leaving it
      # unset scopes the cookie to the exact host, which is what a single Render
      # hostname needs.
      - key: SESSION_SECURE_COOKIE
        value: true
      - key: QUEUE_CONNECTION
        value: database
      # InitiateSchoolPayout is ShouldBeUnique, which needs a cache lock. The
      # database store is Laravel's default and the cache table is migrated, so
      # the three services share one lock namespace with no Redis instance to pay
      # for. Do not switch this to `array` or `file`: per-container caches would
      # give each service its own lock.
      - key: CACHE_STORE
        value: database
      # Render's filesystem is ephemeral, so file logs vanish on restart. stderr is
      # captured and retained by Render, which matters for the critical payout and
      # financial-integrity events.
      - key: LOG_CHANNEL
        value: stderr

      # ---- Paystack (HIGH-3) ------------------------------------------------
      # Secrets: set in the Render dashboard, never in this file or the repo.
      - key: PAYSTACK_SECRET_KEY
        sync: false
      # Declared for completeness. No application code reads it today — the
      # checkout is a server-side redirect to Paystack's authorization_url, not an
      # inline JS popup — but it is required if an inline flow is ever added.
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_PAYMENT_URL
        value: https://api.paystack.co

      # ---- Mail (HIGH-4) ----------------------------------------------------
      # Without these, mail.default resolves to 'log' and no receipt is delivered.
      - key: MAIL_MAILER
        value: smtp
      # Provider-specific; set in the dashboard so a blueprint re-sync cannot
      # overwrite them. MAIL_SCHEME is smtp (STARTTLS/587) or smtps (TLS/465) —
      # Laravel 12 builds the DSN from it; MAIL_ENCRYPTION is no longer read.
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_SCHEME
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        sync: false

  # ---------------------------------------------------------------------------
  # Payouts and receipts are queued jobs, so without a worker a settled payment
  # would record its obligation and never transfer. This worker drains the same
  # database queue the web service writes to.
  #
  # This is the one line item that CANNOT be cheapened. Background workers have no
  # Free plan, so 0.5c-512mb is already Render's floor, and the alternatives that
  # would remove the $7 are all worse:
  #   - folding queue:work into the web container (the image's supervisord can do
  #     it) ties payout processing to web deploys and autoscaling, and makes a
  #     memory spike in the HTTP server kill an in-flight transfer;
  #   - replacing it with a frequent cron running queue:work --stop-when-empty
  #     buys a fixed money-movement path with a best-effort one: Render silently
  #     skips a cron run that overlaps the previous one and does not retry a run
  #     that fails, and per-minute container cold starts erase most of the saving.
  # ---------------------------------------------------------------------------
  - type: worker
    name: laravel-queue-worker
    runtime: docker
    dockerfilePath: ./docker/Dockerfile
    dockerContext: .
    plan: 0.5c-512mb
    dockerCommand: php artisan queue:work database --queue=default --sleep=3 --tries=3 --max-time=3600 --backoff=30
    envVars:
      # Only the web service migrates. Three containers racing `migrate --force`
      # against one Postgres on first deploy could half-apply a migration to the
      # ledger; Render does not order Blueprint services.
      - key: SKIP_MIGRATIONS
        value: true
      - key: APP_ENV
        value: production
      - key: APP_NAME
        sync: false
      - key: APP_DEBUG
        value: false
      # Must be the SAME value as the web service's APP_KEY: the worker renders and
      # signs the receipt links that the web service later has to validate. Paste
      # the identical key into both services' dashboards.
      - key: APP_KEY
        sync: false
      # Must be the SAME value as the web service's APP_URL. RENDER_EXTERNAL_URL
      # does not exist on workers at all, so this cannot be derived — set it by
      # hand or the emailed receipt links point at http://localhost.
      - key: APP_URL
        sync: false
      # Must resolve to the SAME PostgreSQL database as the web service: the
      # database queue is what carries payout jobs between them.
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: database
          property: connectionString
      - key: QUEUE_CONNECTION
        value: database
      # Same shared lock namespace as the web service — see its CACHE_STORE note.
      - key: CACHE_STORE
        value: database
      - key: LOG_CHANNEL
        value: stderr

      # ---- Paystack (HIGH-3) ------------------------------------------------
      # The worker performs the school transfers, so it needs the secret key.
      # It does not need the public key.
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PAYMENT_URL
        value: https://api.paystack.co

      # ---- Mail (HIGH-4) ----------------------------------------------------
      # The worker is what renders and sends PaymentReceiptMail, so it needs the
      # full mail configuration too. Use the same values as the web service.
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_SCHEME
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        sync: false

  # ---------------------------------------------------------------------------
  # Hourly reconciliation / recovery. This is NOT the payout mechanism — payouts are
  # created and queued the moment a payment settles (Model A). This job only catches
  # what settlement missed: a payment whose obligation was never recorded, or an
  # obligation whose job never reached the queue. It records and enqueues; it never
  # calls Paystack itself, so every transfer still goes through InitiateSchoolPayout,
  # the atomic pending->initiating claim and the payout state machine. It is safe to
  # run repeatedly: a payout that is initiating, processing, success, reversed,
  # failed or needs_review is left untouched.
  #
  # Cost note: cron jobs are the one Render service billed per second of actual
  # runtime rather than as a monthly plan, subject to a $1/month minimum. An hourly
  # run of a few seconds costs far less than the minimum, so this service is $1/mo
  # on ANY plan — there is nothing to save by starving it, and 0.5c-512mb is the
  # smallest plan offered regardless.
  # ---------------------------------------------------------------------------
  - type: cron
    name: laravel-payout-reconciliation
    runtime: docker
    dockerfilePath: ./docker/Dockerfile
    dockerContext: .
    plan: 0.5c-512mb
    schedule: "0 * * * *"
    # `command:` is not a Blueprint field. A Docker-runtime service overrides the
    # image CMD with dockerCommand.
    dockerCommand: php artisan payouts:run --dispatch
    envVars:
      # See the worker's note: only the web service runs migrations.
      - key: SKIP_MIGRATIONS
        value: true
      - key: APP_ENV
        value: production
      - key: APP_NAME
        sync: false
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        sync: false
      # Same value as the other two services; RENDER_EXTERNAL_URL is not available
      # to cron jobs either.
      - key: APP_URL
        sync: false
      # Same PostgreSQL instance as the web service and worker.
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: database
          property: connectionString
      # Writes InitiateSchoolPayout jobs onto the same database queue the worker drains.
      - key: QUEUE_CONNECTION
        value: database
      # ShouldBeUnique is evaluated at dispatch time too, so the cron needs the same
      # shared cache store as the worker.
      - key: CACHE_STORE
        value: database
      - key: LOG_CHANNEL
        value: stderr
      # Needed so a payout amount can be resolved and the queued job is well formed.
      # The cron itself makes no Paystack call; the worker performs the transfer.
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PAYMENT_URL
        value: https://api.paystack.co

databases:
  - name: database
    # NOT free: a Free Postgres expires 30 days after creation and gets neither
    # logical backups nor point-in-time recovery, which is unacceptable for the
    # ledger that payments and payouts are written to.
    # NOT 'starter' either: unlike the service plans above, Postgres 'starter' is
    # a legacy instance type Render no longer offers for new databases.
    # 0.1c-256mb (legacy name basic-256mb) is the smallest PAID Postgres plan and
    # the cheapest one that gets logical backups plus point-in-time recovery — 3
    # days of PITR on a Hobby workspace, 7 on Pro. Size up in the dashboard as the
    # ledger grows; compute can be changed in both directions.
    plan: 0.1c-256mb
    # Storage is billed separately from compute at $0.30/GB/mo, and Render lets you
    # GROW a database's disk online but never shrink it — so the size chosen at
    # creation is a floor on the bill forever. 1 GB is the minimum and is ample for
    # this ledger; raise it in the dashboard (next step is 5 GB) before it fills.
    diskSizeGB: 1
